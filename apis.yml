aid: evvy
name: Evvy
description: >-
  Evvy is a women's health company offering at-home vaginal microbiome testing
  and personalized care. Its CLIA-certified metagenomic (mNGS) Vaginal Health
  Test identifies over 700 bacteria and fungi from a self-collected sample,
  with results reviewed by licensed clinicians who deliver personalized insights
  and clinician-designed treatment programs for conditions such as bacterial
  vaginosis, aerobic vaginitis, yeast infections, recurrent UTIs, and
  fertility-related concerns. Evvy also sells a line of vaginal health products
  including probiotics and boric-acid, hyaluronic-acid, and probiotic
  suppositories, plus a provider program for clinicians and a large library of
  science-backed educational content. Backed by General Catalyst, Evvy was
  surfaced as a portfolio company and added to the API Evangelist network. Evvy
  is a direct-to-consumer health and e-commerce business and does not currently
  publish a public developer API, OpenAPI, or SDK surface.
